[project]
name = "payday-budget"
version = "0.1.0"
description = "Self-hosted household budgeting built around pay periods"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "typer==0.27.2",
    "argon2-cffi==25.1.0",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
]

[project.scripts]
pb = "app.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
    "httpx2==2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # starlette 1.6.0 imports the deprecated anyio.abc.BlockingPortal alias at import time.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
